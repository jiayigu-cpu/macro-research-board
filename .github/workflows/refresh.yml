name: refresh-data

# 定时抓数 + 发布：GitHub Actions 里跑 Python + akshare，产出 data.json 后提交回仓库，
# 并在同一个 job 里重新发布 Pages。
# 为什么不靠 push 触发 deploy-pages：Actions 用 GITHUB_TOKEN 提交的 push 不会再触发其它
# workflow（GitHub 防递归机制），所以这里必须自己走完部署。
on:
  schedule:
    # UTC 时间，对应北京时间 08:40 / 11:40 / 15:40（工作日）
    - cron: '40 0,3,7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 抓取数据
        run: python fetch_data.py

      - name: 同步静态副本
        run: cp -f data.json public/data.json

      - name: 提交变更
        run: |
          git config user.name  "macro-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json public/data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新宏观数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      # 上传刚结束就查 artifact 会返回 0 个（索引尚未可见），等几秒再部署
      - name: 等待 artifact 索引
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
