name: refresh-data

# 定时抓数：GitHub Actions 里跑 Python + akshare，产出 data.json 后提交回仓库。
# 前端是纯静态页面，轮询读取 data.json，因此数据刷新完全免费，不依赖任何服务器。
on:
  schedule:
    # UTC 时间，对应北京时间 08:40 / 11:40 / 15:40（工作日）
    - cron: '40 0,3,7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: 抓取数据
        run: python fetch_data.py

      - name: 同步静态副本
        run: cp -f data.json public/data.json

      - name: 提交变更
        run: |
          git config user.name  "macro-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json public/data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新宏观数据 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
